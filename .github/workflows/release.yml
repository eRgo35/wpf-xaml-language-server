name: Release

on:
  push:
    tags: ['v*']

# Creating the GitHub release needs write access to the repository contents.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        # Framework-dependent: loading projects needs a .NET SDK on the machine anyway.
        run: dotnet publish src/WpfXaml.LanguageServer -c Release -o out

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd out && zip -qr "../wpf-xaml-ls-${version}.zip" .)
          # Release notes: this version's section of the changelog.
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "wpf-xaml-ls-${version}.zip" --title "$GITHUB_REF_NAME" --notes-file notes.md
